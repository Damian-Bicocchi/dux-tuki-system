services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    volumes:
      - db-data:/app/BD
    environment:
      - PORT=3001
      - DB_PATH=/app/BD/database.db
      - JWT_SECRET=diseno-y-experiencia-de-usuario
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db-data:

